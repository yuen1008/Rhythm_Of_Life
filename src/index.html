<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm of Life</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Landing / Animal Selection -->
        <section id="selection-screen" class="screen active">
            <h1>Rhythm of Life</h1>
            <p>Select an endangered species and connect with their heartbeat.</p>
            <div class="animal-grid" id="animal-grid">
                <!-- Populated by JS -->
            </div>
        </section>

        <!-- Interaction Screen -->
        <section id="interaction-screen" class="screen hidden">
            <header>
                <button id="back-btn">← Back</button>
                <h2 id="current-animal-name">Animal Name</h2>
                <div class="bpm-indicator">Target BPM: <span id="target-bpm">0</span> | Your BPM: <span id="user-bpm">0</span></div>
            </header>
            
            <main class="puzzle-container">
                <div id="puzzle-wrapper">
                    <img id="puzzle-image" src="" alt="Animal Image">
                    <div id="puzzle-mask-grid"></div> <!-- Grid of blocks to hide the image -->
                </div>
                
                <div class="instructions">
                    <p>Tap the <strong>SPACEBAR</strong> to match the heartbeat.</p>
                    <div id="heart-pulse">❤️</div>
                </div>
            </main>
        </section>

        <!-- Story Mode Screen -->
        <section id="story-screen" class="screen hidden">
            <div class="story-viewport">
                <img id="story-image" src="" alt="Story View">
            </div>
            <div class="story-overlay">
                <h2 id="story-title">You connected with the...</h2>
                <p id="story-text">Listening to their rhythm...</p>
                <button id="restart-btn">Try Another</button>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
